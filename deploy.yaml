apiVersion: "2019-12-01"
location: switzerlandnorth
name: cloudlab-aci

properties:
  containers:
    - name: cloudlab
      properties:
        image: ertihoxha/cloud-lab:2.0

        ports:
          - port: 8080

        resources:
          requests:
            cpu: 0.5
            memoryInGB: 0.5

        environmentVariables:
          - name: APP_VERSION
            value: "2.0"

  osType: Linux
  restartPolicy: OnFailure

  ipAddress:
    type: Public

    dnsNameLabel: cloudlab-20240001

    ports:
      - protocol: tcp
        port: 8080

type: Microsoft.ContainerInstance/containerGroups